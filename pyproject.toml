[project]
name = "clusterdoctor"
version = "0.1.0"
description = "ES 클러스터 진단 서비스"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.10.0",
    "clickhouse-connect>=1.7,<2",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "litellm>=1.97.0",
    "langgraph>=1.2.11",
    "grandalf>=0.8",
    "playwright>=1.62.0",
    "elasticsearch==8.*",
    "langchain-google-genai>=4.3.5",
    "deepagents>=0.7.8",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
